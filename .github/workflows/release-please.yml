name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR from conventional commits; on merge it bumps the
      # version (CHANGELOG.md + herdr-plugin.toml), tags, and creates the
      # GitHub release. No binaries are attached: installs build from source
      # (specs/006-build-from-source.md).
      # Config: release-please-config.json + manifest.
      - uses: googleapis/release-please-action@v5
        id: release
